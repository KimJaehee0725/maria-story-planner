services:
  drama-planner:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: drama-planner
    network_mode: "host"
    environment:
      OPENAI_BASE_URL: "${OPENAI_BASE_URL:-http://127.0.0.1:18000/v1}"
      OPENAI_API_KEY: "${OPENAI_API_KEY:-sk-local}"
      OPENAI_MODEL: "${OPENAI_MODEL:-Qwen/Qwen3.6-35B-A3B-FP8}"
      HOST: "${HOST:-0.0.0.0}"
      PORT: 8765
      NODE_ENV: "${NODE_ENV:-production}"
    volumes:
      - drama-planner-storage:/app/storage
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8765/api/health"]
      interval: 30s
      timeout: 3s
      retries: 3
      start_period: 5s

volumes:
  drama-planner-storage:
    driver: local
